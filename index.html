<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matematika Test | Mini App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-gray-50 min-h-screen p-4 sm:p-6">

    <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
        <!-- Yuqori qism (Ism va Taymer) -->
        <div class="flex justify-between items-center border-b border-gray-100 pb-4 mb-6">
            <div>
                <h1 id="studentName" class="text-xl font-bold text-gray-800">O'quvchi</h1>
                <p class="text-xs text-gray-400">Milliy Sertifikat Testi</p>
            </div>
            <div id="timer" class="bg-indigo-50 text-indigo-600 font-bold px-4 py-2 rounded-xl text-sm">
                ⏳ 120:00
            </div>
        </div>

        <!-- Savollar maydoni -->
        <div id="questionsContainer" class="space-y-6 mb-8">
            <!-- Savollar shu yerga avtomatik chiqadi -->
        </div>

        <!-- Yuborish tugmasi -->
        <button onclick="submitTest()" class="w-full bg-emerald-600 text-white py-4 rounded-xl font-bold text-lg hover:bg-emerald-700 transition shadow-md">
            Testni Yakunlash va Topshirish 🚀
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // URL parametridan yopiq, ochiq soni va ism-familiyani olish
        const urlParams = new URLSearchParams(window.location.search);
        const closedCount = parseInt(urlParams.get('yopiq')) || 35;
        const openCount = parseInt(urlParams.get('ochiq')) || 10;
        const firstName = urlParams.get('first_name') || "Noma'lum";
        const lastName = urlParams.get('last_name') || "";

        document.getElementById('studentName').textContent = `${firstName} ${lastName}`;

        // Savollarni ekranga chiqarish
        function renderQuestions() {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';
            const total = closedCount + openCount;

            for (let i = 1; i <= total; i++) {
                let isClosed = i <= closedCount;
                let html = '';

                if (isClosed) {
                    html = `
                        <div class="p-4 rounded-xl border border-gray-100 bg-gray-50/50">
                            <span class="block font-bold text-gray-700 mb-2">${i}-savol (Yopiq)</span>
                            <div class="flex gap-4">
                                ${['A', 'B', 'C', 'D'].map(opt => `
                                    <label class="flex items-center gap-2 cursor-pointer font-medium text-gray-600">
                                        <input type="radio" name="q${i}" value="${opt}" class="w-4 h-4 text-indigo-600"> ${opt}
                                    </label>
                                `).join('')}
                            </div>
                        </div>
                    `;
                } else {
                    html = `
                        <div class="p-4 rounded-xl border border-gray-100 bg-gray-50/50">
                            <span class="block font-bold text-emerald-700 mb-2">${i}-savol (Ochiq)</span>
                            <input type="text" id="q${i}" placeholder="Javobni kiriting..." class="w-full sm:w-1/2 border border-gray-200 p-2.5 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium">
                        </div>
                    `;
                }
                container.innerHTML += html;
            }
        }

        // Testni yuborish
        function submitTest() {
            if (!confirm("Testni yakunlashni xohlaysizmi?")) return;

            let answers = {
                first_name: firstName,
                last_name: lastName
            };

            const total = closedCount + openCount;
            for (let i = 1; i <= total; i++) {
                let isClosed = i <= closedCount;
                if (isClosed) {
                    const selected = document.querySelector(`input[name="q${i}"]:checked`);
                    answers[`q${i}`] = selected ? selected.value : "";
                } else {
                    const val = document.getElementById(`q${i}`).value.trim();
                    answers[`q${i}`] = val;
                }
            }

            // Telegram botga ma'lumotni qaytarish
            tg.sendData(JSON.stringify(answers));
            tg.close();
        }

        // Taymer (120 daqiqa)
        let timeLeft = 120 * 60;
        setInterval(() => {
            if (timeLeft <= 0) {
                submitTest();
                return;
            }
            timeLeft--;
            let mins = Math.floor(timeLeft / 60);
            let secs = timeLeft % 60;
            document.getElementById('timer').textContent = `⏳ ${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }, 1000);

        renderQuestions();
    </script>
</body>
</html>
