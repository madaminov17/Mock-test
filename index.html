<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matematika Test | Mini App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-gray-100 py-6 px-4">

    <div class="max-w-xl mx-auto bg-white rounded-2xl shadow-md p-6">
        <!-- O'quvchi ismi -->
        <div class="border-b pb-4 mb-6 text-center">
            <h1 id="studentName" class="text-2xl font-bold text-indigo-900">O'quvchi</h1>
            <p class="text-sm text-gray-500 mt-1">Matematika Milliy Sertifikat Testi</p>
        </div>

        <!-- Savollar ro'yxati -->
        <div id="questionsContainer" class="space-y-4 mb-6">
            <!-- JavaScript orqali savollar shu yerga chiqadi -->
        </div>

        <!-- Yuborish tugmasi -->
        <button onclick="submitTest()" class="w-full bg-indigo-600 text-white py-3.5 rounded-xl font-bold text-lg hover:bg-indigo-700 transition shadow">
            Natijani Topshirish 🚀
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // URL parametrlarini olish
        const urlParams = new URLSearchParams(window.location.search);
        const closedCount = parseInt(urlParams.get('yopiq')) || 35;
        const openCount = parseInt(urlParams.get('ochiq')) || 10;
        const firstName = urlParams.get('first_name') || "Noma'lum";
        const lastName = urlParams.get('last_name') || "";

        document.getElementById('studentName').textContent = `${firstName} ${lastName}`;

        // Savollarni chiroyli va tartibli chiqarish
        function renderQuestions() {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';
            const total = closedCount + openCount;

            for (let i = 1; i <= total; i++) {
                let isClosed = i <= closedCount;
                let html = '';

                if (isClosed) {
                    // Yopiq savollar (A, B, C, D)
                    html = `
                        <div class="bg-gray-50 p-4 rounded-xl border border-gray-200">
                            <span class="block font-bold text-gray-700 mb-2">${i}-savol (Yopiq)</span>
                            <div class="grid grid-cols-4 gap-2">
                                ${['A', 'B', 'C', 'D'].map(opt => `
                                    <label class="flex items-center justify-center py-2 bg-white border border-gray-300 rounded-lg cursor-pointer hover:bg-indigo-50 font-semibold text-gray-700">
                                        <input type="radio" name="q${i}" value="${opt}" class="mr-1.5 accent-indigo-600"> ${opt}
                                    </label>
                                `).join('')}
                            </div>
                        </div>
                    `;
                } else {
                    // Ochiq savollar (Raqam yoki matn yozish)
                    html = `
                        <div class="bg-gray-50 p-4 rounded-xl border border-gray-200">
                            <span class="block font-bold text-indigo-700 mb-2">${i}-savol (Ochiq)</span>
                            <input type="text" id="q${i}" placeholder="Javobni kiriting..." class="w-full border border-gray-300 bg-white p-3 rounded-lg focus:outline-none focus:border-indigo-600 font-medium">
                        </div>
                    `;
                }
                container.innerHTML += html;
            }
        }

        // Testni yuborish
        function submitTest() {
            if (!confirm("Test javoblarini topshirishni tasdiqlaysizmi?")) return;

            let answers = {
                first_name: firstName,
                last_name: lastName
            };

            const total = closedCount + openCount;
            for (let i = 1; i <= total; i++) {
                let isClosed = i <= closedCount;
                if (isClosed) {
                    const selected = document.querySelector(`input[name="q${i}"]:checked`);
                    answers[`q${i}`] = selected ? selected.value : "";
                } else {
                    const val = document.getElementById(`q${i}`).value.trim();
                    answers[`q${i}`] = val;
                }
            }

            // Ma'lumotni Telegram botga yuborish
            if (window.Telegram && window.Telegram.WebApp && tg.initDataUnsafe && tg.initDataUnsafe.user) {
                tg.sendData(JSON.stringify(answers));
                tg.close();
            } else {
                // Agar oddiy brauzerda ochilgan bo'lsa xabar berish uchun
                alert("Iltimos, testni to'g'ridan-to'g'ri Telegram bot ichidan ochib topshiring!");
                console.log("Yuborilayotgan obyekt:", answers);
            }
        }

        renderQuestions();
    </script>
</body>
</html>
