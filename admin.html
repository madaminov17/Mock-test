<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Matematika Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 flex flex-col md:flex-row min-h-screen">
    
    <!-- Mobil uchun yuqori panel va Burger menyu -->
    <header class="bg-indigo-900 text-white p-4 flex justify-between items-center md:hidden">
        <h2 class="text-xl font-bold">LMS Admin</h2>
        <button onclick="toggleSidebar()" class="p-2 rounded-lg bg-indigo-800 focus:outline-none">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>
    </header>

    <!-- Sidebar (Yon panel - telefonlarda yashirin bo'ladi, tugma bosganda chiqadi) -->
    <aside id="sidebar" class="w-64 bg-indigo-900 text-white p-6 hidden md:block fixed md:static inset-y-0 left-0 z-50 transition-all duration-300">
        <div class="flex justify-between items-center mb-10">
            <h2 class="text-2xl font-bold tracking-wide">LMS Admin</h2>
            <button onclick="toggleSidebar()" class="md:hidden text-white">✕</button>
        </div>
        <nav class="space-y-3">
            <a href="#" class="block py-2.5 px-4 rounded-lg bg-indigo-700 font-medium">📊 Natijalar va Tahlil</a>
        </nav>
    </aside>

    <!-- Asosiy Oyna -->
    <main class="flex-1 p-4 sm:p-6 md:p-10 max-w-7xl mx-auto w-full">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
            <h1 class="text-2xl md:text-3xl font-bold text-gray-800">Boshqaruv Paneli</h1>
            <button onclick="loadData()" class="w-full sm:w-auto bg-indigo-600 text-white px-4 py-2.5 rounded-xl font-medium hover:bg-indigo-700 transition shadow-sm text-center">Ma'lumotlarni Yangilash 🔄</button>
        </div>

        <!-- Yangi test yaratish formasi -->
        <div class="bg-white p-5 sm:p-6 rounded-2xl shadow-sm border border-gray-100 mb-8">
            <h2 class="text-lg font-bold mb-4 text-gray-700">📝 Yangi Test Yaratish va Faollashtirish</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 mb-4">
                <input type="text" id="testTitle" placeholder="Test nomi (masalan: 1-Mavzu)" class="border border-gray-200 p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 w-full">
                <input type="number" id="closedCount" placeholder="Yopiq savollar soni (35)" class="border border-gray-200 p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 w-full" value="35">
                <input type="number" id="openCount" placeholder="Ochiq savollar soni (10)" class="border border-gray-200 p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 w-full" value="10">
            </div>
            <textarea id="testKeys" placeholder="To'g'ri kalitlarni probel bilan kiriting (Masalan: A B C D ... 12 15)" class="w-full border border-gray-200 p-3 rounded-xl mb-4 focus:outline-none focus:ring-2 focus:ring-indigo-500" rows="3"></textarea>
            <button onclick="createTest()" class="w-full sm:w-auto bg-emerald-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-emerald-700 transition shadow-sm">Testni Saqlash va Faollashtirish 🚀</button>
        </div>

        <!-- Natijalar bo'limi -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="p-5 sm:p-6 border-b border-gray-100 flex justify-between items-center flex-wrap gap-2">
                <h3 class="text-lg font-bold text-gray-700">O'quvchilar Natijalari</h3>
                <span id="totalCount" class="text-sm bg-indigo-50 text-indigo-600 px-3 py-1 rounded-full font-medium">Jami: 0 ta</span>
            </div>
            <!-- Mobil ekranlar uchun jadval gorizontal o'raladi (scroll bo'ladi) -->
            <div class="overflow-x-auto">
                <table class="min-w-full text-left border-collapse">
                    <thead class="bg-gray-50 text-gray-400 uppercase text-xs tracking-wider">
                        <tr>
                            <th class="px-4 sm:px-6 py-4 font-semibold">O'quvchi ID</th>
                            <th class="px-4 sm:px-6 py-4 font-semibold">To'g'ri / Jami</th>
                            <th class="px-4 sm:px-6 py-4 font-semibold">Foiz</th>
                            <th class="px-4 sm:px-6 py-4 font-semibold">Topshirgan vaqti</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100 text-gray-600 text-sm" id="resultsTable">
                        <tr><td colspan="4" class="px-6 py-6 text-center text-gray-400">Yuklanmoqda...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = "https://morimienswrvhcctnptt.supabase.co";
        const SUPABASE_KEY = "sb_publishable_1zHi0RhZgvwJulz9y3Rzhg_CAmS-uZS";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Mobil sidebar ochib-yopish funksiyasi
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('hidden');
        }

        async function loadData() {
            const tbody = document.getElementById('resultsTable');
            const totalCountSpan = document.getElementById('totalCount');
            tbody.innerHTML = `<tr><td colspan="4" class="px-6 py-6 text-center text-gray-400">Yuklanmoqda...</td></tr>`;

            const { data, error } = await supabaseClient.from('test_results').select('*').order('id', { ascending: false });
            
            if (error) {
                alert("Xatolik: " + error.message);
                return;
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="px-6 py-6 text-center text-gray-400">Hozircha natijalar mavjud emas.</td></tr>`;
                totalCountSpan.textContent = `Jami: 0 ta`;
                return;
            }

            totalCountSpan.textContent = `Jami: ${data.length} ta`;
            tbody.innerHTML = '';
            
            data.forEach(res => {
                let percent = Math.round((res.correct_count / res.total) * 100);
                let badgeColor = percent >= 70 ? 'bg-emerald-50 text-emerald-600' : percent >= 40 ? 'bg-amber-50 text-amber-600' : 'bg-rose-50 text-rose-600';

                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50/50 transition">
                        <td class="px-4 sm:px-6 py-4 font-medium text-gray-800">${res.telegram_id}</td>
                        <td class="px-4 sm:px-6 py-4 font-bold text-gray-900">${res.correct_count} / ${res.total}</td>
                        <td class="px-4 sm:px-6 py-4">
                            <span class="px-2.5 py-1 rounded-lg text-xs font-bold ${badgeColor}">${percent}%</span>
                        </td>
                        <td class="px-4 sm:px-6 py-4 text-gray-400 text-xs sm:text-sm">${new Date(res.submitted_at).toLocaleString()}</td>
                    </tr>
                `;
            });
        }

        async function createTest() {
            const title = document.getElementById('testTitle').value.trim();
            const closed_count = parseInt(document.getElementById('closedCount').value);
            const open_count = parseInt(document.getElementById('openCount').value);
            const keys = document.getElementById('testKeys').value.trim().split(/\s+/);

            if (!title || keys.length !== (closed_count + open_count)) {
                alert(`Xatolik! Kiritilgan kalitlar soni (${keys.length} ta) jami savollar soniga (${closed_count + open_count} ta) mos kelishi kerak.`);
                return;
            }

            await supabaseClient.from('tests').update({ is_active: false }).eq('is_active', true);

            const { error } = await supabaseClient.from('tests').insert({
                title: title,
                closed_count: closed_count,
                open_count: open_count,
                keys: keys,
                is_active: true
            });

            if (error) {
                alert("Saqlashda xatolik: " + error.message);
            } else {
                alert("✅ Yangi test muvaffaqiyatli yaratildi va faollashtirildi!");
                document.getElementById('testTitle').value = '';
                document.getElementById('testKeys').value = '';
                loadData();
            }
        }

        loadData();
    </script>
</body>
</html>
