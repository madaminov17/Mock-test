<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Matematika Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 min-h-screen">

    <!-- Yuqori panel -->
    <header class="bg-indigo-900 text-white p-4 sm:p-5 flex justify-between items-center sticky top-0 z-40 shadow-md">
        <h2 class="text-lg sm:text-xl font-bold tracking-wide">📊 LMS Admin Panel</h2>
        <div class="flex gap-2">
            <button onclick="loadData()" class="bg-indigo-700 hover:bg-indigo-600 text-white px-3 sm:px-4 py-2 rounded-xl font-medium transition text-sm">🔄 Yangilash</button>
            <button onclick="openModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 sm:px-4 py-2 rounded-xl font-bold transition text-sm">➕ Yangi test</button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto w-full p-4 sm:p-6 space-y-8">

        <!-- FAOL TEST HOLATI -->
        <div id="activeTestBanner" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex justify-between items-center flex-wrap gap-2">
            <span class="text-gray-500 text-sm">Faol test yuklanmoqda...</span>
        </div>

        <!-- 1. GURUHLAR VA O'QUVCHILAR -->
        <section class="bg-white p-5 sm:p-6 rounded-2xl shadow-sm border border-gray-100">
            <h2 class="text-lg font-bold mb-4 text-gray-700">👥 Guruhlar va O'quvchilar</h2>

            <div class="flex flex-col sm:flex-row gap-3 mb-4">
                <input type="text" id="groupName" placeholder="Guruh nomi (masalan: Nukus Fiz-Mat 10-sinf)" class="border border-gray-200 p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 flex-1">
                <button onclick="createGroup()" class="bg-blue-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-blue-700 transition shadow-sm">Guruh qo'shish ➕</button>
            </div>
            <div id="groupsList" class="flex flex-wrap gap-2 mb-6"></div>

            <div class="overflow-x-auto">
                <table class="min-w-full text-left border-collapse">
                    <thead class="bg-gray-50 text-gray-400 uppercase text-xs tracking-wider">
                        <tr>
                            <th class="px-4 py-3 font-semibold">Ism Familiya</th>
                            <th class="px-4 py-3 font-semibold">Telegram ID</th>
                            <th class="px-4 py-3 font-semibold">Guruh</th>
                            <th class="px-4 py-3 font-semibold">Holati</th>
                            <th class="px-4 py-3 font-semibold">Amal</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100 text-gray-600 text-sm" id="studentsTable">
                        <tr><td colspan="5" class="px-4 py-6 text-center text-gray-400">Yuklanmoqda...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- 2. NATIJALAR JADVALI -->
        <section class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="p-5 sm:p-6 border-b border-gray-100 flex justify-between items-center flex-wrap gap-2">
                <h3 class="text-lg font-bold text-gray-700">🏆 O'quvchilar Natijalari</h3>
                <span id="totalCount" class="text-sm bg-indigo-50 text-indigo-600 px-3 py-1 rounded-full font-medium">Jami: 0 ta</span>
            </div>
            <div class="overflow-x-auto">
                <table class="min-w-full text-left border-collapse">
                    <thead class="bg-gray-50 text-gray-400 uppercase text-xs tracking-wider">
                        <tr>
                            <th class="px-4 sm:px-6 py-4 font-semibold">O'quvchi</th>
                            <th class="px-4 sm:px-6 py-4 font-semibold">To'g'ri / Jami</th>
                            <th class="px-4 sm:px-6 py-4 font-semibold">Foiz</th>
                            <th class="px-4 sm:px-6 py-4 font-semibold">Topshirgan vaqti</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100 text-gray-600 text-sm" id="resultsTable">
                        <tr><td colspan="4" class="px-6 py-6 text-center text-gray-400">Yuklanmoqda...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- MODAL: YANGI TEST YARATISH -->
    <div id="testModalOverlay" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-lg w-full max-w-3xl max-h-[90vh] overflow-y-auto p-5 sm:p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-gray-700">📝 Yangi Test Yaratish va Kalitlarni Belgilash</h2>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-700 text-2xl leading-none">✕</button>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-4">
                <input type="text" id="testTitle" placeholder="Test nomi (masalan: 1-Mavzu)" class="border border-gray-200 p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 w-full sm:col-span-3">
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">Yopiq savollar soni:</label>
                    <input type="number" id="closedCount" onchange="generateKeyInputs()" class="border border-gray-200 p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 w-full" value="35">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">Ochiq savollar soni:</label>
                    <input type="number" id="openCount" onchange="generateKeyInputs()" class="border border-gray-200 p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 w-full" value="10">
                </div>
                <div class="flex items-end">
                    <button onclick="generateKeyInputs()" class="w-full bg-gray-800 text-white p-3 rounded-xl font-bold hover:bg-black transition">Kataklarni Hosil Qilish ⚙️</button>
                </div>
            </div>

            <div class="mb-4">
                <label class="block text-sm font-bold text-gray-700 mb-2">To'g'ri javoblar kataklari:</label>
                <div id="keysContainer" class="grid grid-cols-2 sm:grid-cols-5 md:grid-cols-9 gap-3 max-h-64 overflow-y-auto p-2 border border-gray-100 rounded-xl bg-gray-50"></div>
            </div>

            <button onclick="createTest()" class="w-full bg-emerald-600 text-white px-6 py-3.5 rounded-xl font-bold hover:bg-emerald-700 transition shadow-sm">Testni Saqlash va Faollashtirish 🚀</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://morimienswrvhcctnptt.supabase.co";
        const SUPABASE_KEY = "sb_publishable_1zHi0RhZgvwJulz9y3Rzhg_CAmS-uZS";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let groupsCache = [];

        window.onload = function() {
            generateKeyInputs();
            loadGroups();
            loadStudents();
            loadData();
        }

        // ---------- MODAL ----------
        function openModal() {
            document.getElementById('testModalOverlay').classList.remove('hidden');
        }
        function closeModal() {
            document.getElementById('testModalOverlay').classList.add('hidden');
        }

        // ---------- TEST KALITLARI ----------
        function generateKeyInputs() {
            const closed = parseInt(document.getElementById('closedCount').value) || 0;
            const open = parseInt(document.getElementById('openCount').value) || 0;
            const total = closed + open;
            const container = document.getElementById('keysContainer');
            container.innerHTML = '';

            for (let i = 1; i <= total; i++) {
                let isClosed = i <= closed;
                let html = '';

                if (isClosed) {
                    html = `
                        <div class="bg-white p-2 rounded-lg border border-gray-200 text-center shadow-xs">
                            <span class="block text-xs font-bold text-gray-500 mb-1">${i}-savol (Y)</span>
                            <select id="key_${i}" class="w-full border border-gray-200 rounded p-1 text-center font-bold text-indigo-600 bg-gray-50 focus:outline-none">
                                <option value="A">A</option>
                                <option value="B">B</option>
                                <option value="C">C</option>
                                <option value="D">D</option>
                            </select>
                        </div>
                    `;
                } else {
                    html = `
                        <div class="bg-white p-2 rounded-lg border border-gray-200 text-center shadow-xs">
                            <span class="block text-xs font-bold text-emerald-600 mb-1">${i}-savol (O)</span>
                            <input type="text" id="key_${i}" placeholder="Javob" class="w-full border border-gray-200 rounded p-1 text-center font-bold text-emerald-600 bg-gray-50 focus:outline-none">
                        </div>
                    `;
                }
                container.innerHTML += html;
            }
        }

        // ---------- GURUHLAR ----------
        async function createGroup() {
            const name = document.getElementById('groupName').value.trim();
            if (!name) {
                alert("Iltimos, guruh nomini kiriting!");
                return;
            }

            const { error } = await supabaseClient.from('groups').insert({ name: name });
            if (error) {
                alert("Xatolik: " + error.message);
            } else {
                document.getElementById('groupName').value = '';
                loadGroups();
            }
        }

        async function loadGroups() {
            const { data, error } = await supabaseClient.from('groups').select('*').order('id', { ascending: true });
            const listDiv = document.getElementById('groupsList');
            if (error) {
                console.error("Guruhlarni yuklashda xatolik:", error.message);
                return;
            }
            groupsCache = data || [];

            listDiv.innerHTML = '';
            groupsCache.forEach(g => {
                listDiv.innerHTML += `<span class="bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded-xl text-xs font-bold border border-indigo-100">📁 ${g.name}</span>`;
            });
        }

        function groupNameById(id) {
            const g = groupsCache.find(g => g.id === id);
            return g ? g.name : '—';
        }

        // ---------- O'QUVCHILAR (RO'YXAT + BLOKLASH) ----------
        async function loadStudents() {
            const tbody = document.getElementById('studentsTable');
            const { data, error } = await supabaseClient.from('students').select('*').order('id', { ascending: false });

            if (error) {
                tbody.innerHTML = `<tr><td colspan="5" class="px-4 py-6 text-center text-rose-500">Xatolik: ${error.message}</td></tr>`;
                console.error("O'quvchilarni yuklashda xatolik:", error.message);
                return;
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="px-4 py-6 text-center text-gray-400">O'quvchilar mavjud emas.</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            data.forEach(st => {
                const blocked = !!st.is_blocked;
                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50/50 transition">
                        <td class="px-4 py-3 font-medium text-gray-800">${st.first_name || ''} ${st.last_name || ''}</td>
                        <td class="px-4 py-3 text-gray-500">${st.telegram_id}</td>
                        <td class="px-4 py-3 text-gray-500">${groupNameById(st.group_id)}</td>
                        <td class="px-4 py-3">
                            <span class="px-2.5 py-1 rounded-lg text-xs font-bold ${blocked ? 'bg-rose-50 text-rose-600' : 'bg-emerald-50 text-emerald-600'}">
                                ${blocked ? '🔒 Bloklangan' : '✅ Faol'}
                            </span>
                        </td>
                        <td class="px-4 py-3">
                            <button onclick="toggleBlock(${st.id}, ${blocked})" class="px-3 py-1.5 rounded-lg text-xs font-bold transition ${blocked ? 'bg-emerald-600 hover:bg-emerald-700 text-white' : 'bg-rose-600 hover:bg-rose-700 text-white'}">
                                ${blocked ? 'Blokdan chiqarish' : 'Bloklash'}
                            </button>
                        </td>
                    </tr>
                `;
            });
        }

        async function toggleBlock(studentId, currentlyBlocked) {
            const { error } = await supabaseClient
                .from('students')
                .update({ is_blocked: !currentlyBlocked })
                .eq('id', studentId);

            if (error) {
                alert("Xatolik: " + error.message);
            } else {
                loadStudents();
            }
        }

        // ---------- TEST YARATISH ----------
        async function createTest() {
            const title = document.getElementById('testTitle').value.trim();
            const closed_count = parseInt(document.getElementById('closedCount').value);
            const open_count = parseInt(document.getElementById('openCount').value);
            const total = closed_count + open_count;

            let keys = [];
            for (let i = 1; i <= total; i++) {
                const val = document.getElementById(`key_${i}`).value.trim();
                if (!val) {
                    alert(`Diqqat! ${i}-savolning javobi bo'sh qolgan.`);
                    return;
                }
                keys.push(val);
            }

            if (!title) {
                alert("Iltimos, test nomini kiriting!");
                return;
            }

            await supabaseClient.from('tests').update({ is_active: false }).eq('is_active', true);

            const { error } = await supabaseClient.from('tests').insert({
                title: title,
                closed_count: closed_count,
                open_count: open_count,
                keys: keys,
                is_active: true
            });

            if (error) {
                alert("Saqlashda xatolik: " + error.message);
            } else {
                alert("✅ Yangi test muvaffaqiyatli yaratildi va faollashtirildi!");
                document.getElementById('testTitle').value = '';
                closeModal();
                loadData();
            }
        }

        // ---------- FAOL TEST BANNERI ----------
        async function loadActiveTestBanner() {
            const banner = document.getElementById('activeTestBanner');
            const { data, error } = await supabaseClient.from('tests').select('*').eq('is_active', true).order('id', { ascending: false }).limit(1);

            if (error || !data || data.length === 0) {
                banner.innerHTML = `<span class="text-gray-400 text-sm">⚠️ Hozircha faol test yo'q</span>`;
                return;
            }

            const t = data[0];
            banner.innerHTML = `
                <div>
                    <span class="text-xs text-gray-400 block">Faol test</span>
                    <span class="font-bold text-gray-800">${t.title}</span>
                </div>
                <span class="text-sm bg-emerald-50 text-emerald-600 px-3 py-1 rounded-full font-medium">${t.closed_count + t.open_count} savol</span>
            `;
        }

        // ---------- NATIJALAR ----------
        async function loadData() {
            loadActiveTestBanner();

            const tbody = document.getElementById('resultsTable');
            const totalCountSpan = document.getElementById('totalCount');
            tbody.innerHTML = `<tr><td colspan="4" class="px-6 py-6 text-center text-gray-400">Yuklanmoqda...</td></tr>`;

            // Natijalar va o'quvchilarni parallel yuklaymiz, keyin ID orqali bog'laymiz
            const [resultsRes, studentsRes] = await Promise.all([
                supabaseClient.from('test_results').select('*').order('id', { ascending: false }),
                supabaseClient.from('students').select('*')
            ]);

            if (resultsRes.error) {
                tbody.innerHTML = `<tr><td colspan="4" class="px-6 py-6 text-center text-rose-500">Xatolik: ${resultsRes.error.message}</td></tr>`;
                console.error("Natijalarni yuklashda xatolik:", resultsRes.error.message);
                return;
            }

            const data = resultsRes.data;
            const studentsMap = {};
            (studentsRes.data || []).forEach(s => { studentsMap[s.telegram_id] = s; });

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="px-6 py-6 text-center text-gray-400">Hozircha natijalar mavjud emas.</td></tr>`;
                totalCountSpan.textContent = `Jami: 0 ta`;
                return;
            }

            totalCountSpan.textContent = `Jami: ${data.length} ta`;
            tbody.innerHTML = '';

            data.forEach(res => {
                let percent = res.total ? Math.round((res.correct_count / res.total) * 100) : 0;
                let badgeColor = percent >= 70 ? 'bg-emerald-50 text-emerald-600' : percent >= 40 ? 'bg-amber-50 text-amber-600' : 'bg-rose-50 text-rose-600';
                const st = studentsMap[res.telegram_id];
                const displayName = st ? `${st.first_name || ''} ${st.last_name || ''}`.trim() : `ID: ${res.telegram_id}`;

                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50/50 transition">
                        <td class="px-4 sm:px-6 py-4 font-medium text-gray-800">${displayName}</td>
                        <td class="px-4 sm:px-6 py-4 font-bold text-gray-900">${res.correct_count} / ${res.total}</td>
                        <td class="px-4 sm:px-6 py-4">
                            <span class="px-2.5 py-1 rounded-lg text-xs font-bold ${badgeColor}">${percent}%</span>
                        </td>
                        <td class="px-4 sm:px-6 py-4 text-gray-400 text-xs sm:text-sm">${new Date(res.submitted_at).toLocaleString()}</td>
                    </tr>
                `;
            });
        }
    </script>
</body>
</html>
